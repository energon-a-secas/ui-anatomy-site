<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title>Test New Layouts</title>
</head>
<body>
    <h1>Testing New Industry Layouts</h1>
    <div id="test-results"></div>
    
    <script type="module">
        // Paths are ../js because this page lives in tests/. Four of these five
        // live in layouts4.js, not layouts2.js, and the export is fortuneLayout
        // with a capital L. Every import here was wrong on all three counts, so
        // the page threw before it rendered a single result.
        import { ecommerceLayout } from '../js/layouts2.js';
        import { fortuneLayout, gamingLayout, saasLayout, fintechLayout } from '../js/layouts4.js';
        
        const results = document.getElementById('test-results');
        const layouts = [
            { name: 'Fortune 500', fn: fortuneLayout },
            { name: 'Ecommerce', fn: ecommerceLayout },
            { name: 'Gaming', fn: gamingLayout },
            { name: 'SaaS', fn: saasLayout },
            { name: 'Fintech', fn: fintechLayout }
        ];
        
        layouts.forEach(layout => {
            try {
                const html = layout.fn({ dummy: true });
                if (html && html.includes('wf-page')) {
                    results.innerHTML += `<p style="color: green">✓ ${layout.name} layout: OK</p>`;
                } else {
                    results.innerHTML += `<p style="color: red">✗ ${layout.name} layout: Failed to generate valid HTML</p>`;
                }
            } catch (error) {
                results.innerHTML += `<p style="color: red">✗ ${layout.name} layout: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
