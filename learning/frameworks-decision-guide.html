  <link rel="stylesheet" href="css/style.css">
  <!-- Neorgon Header Kit (vendored; ?header=live swaps CSS to CDN) -->
  <script>(function(){var m=location.search.match(/[?&]theme=([\w-]+)/)||document.cookie.match(/(?:^|;\s*)neo_theme=([\w-]+)/);if(m&&m[1]!=='default')document.documentElement.dataset.theme=decodeURIComponent(m[1]);})();</script>
  <link rel="stylesheet" href="../css/neorgon-header.css">
  <link rel="stylesheet" href="../css/neorgon-themes.css">
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/header/season.css">
  <script defer src="../js/neorgon-header.js"></script>

</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header-bar" data-header-mode="content">
    <div class="header-logo">
      <a href="./" class="header-title-link">
        <img src="https://cdn.neorgon.org/v1.0.0/energon-classic-logo.png" class="header-logo-img" alt="">
        <div class="header-title-wrap">
        <h1>UI Anatomy</h1>
        <div class="header-subtitle">Frameworks guide</div>
      
        </div>
      </a>
    </div>
    <div class="header-right">
      <div class="header-actions">
      <a data-keep-mobile class="header-back" href="./" title="Back to Learning Hub">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
        <span>Back to Learning Hub</span>
      </a>
      </div>
      <a class="header-home" href="https://neorgon.com/" title="neorgon.com" aria-label="Neorgon home">
        <svg class="nh-hub-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="4.4"/>
          <ellipse cx="12" cy="12" rx="8.4" ry="3" transform="rotate(-18 12 12)"/>
          <g class="nh-orbit">
            <path d="M17.5 4.2 14.2 2.7l.9 1.4-.6 1.1z" fill="currentColor" stroke="none"/>
            <circle cx="12.6" cy="3" r=".7" fill="currentColor" stroke="none" opacity=".55"/>
            <circle cx="11.1" cy="3.3" r=".55" fill="currentColor" stroke="none" opacity=".35"/>
            <circle cx="9.8" cy="3.7" r=".4" fill="currentColor" stroke="none" opacity=".2"/>
          </g>
        </svg>
      </a>
    </div>
  </header>

  <main id="main" class="learning-main">
    <div class="guide-page">
      <p id="guideStatus" class="guide-status">Loading guide…</p>
      <article id="guideRoot" class="md-article" hidden></article>
      <p id="guideError" class="guide-error" hidden></p>
      <p class="guide-source-note">
        <a href="./frameworks-decision-guide.md" download>Download Markdown source</a>
      </p>
    </div>
  </main>

  <footer class="neo-footer" data-footer-mode="minimal">
  </footer>

  <script type="module">
    const status = document.getElementById('guideStatus');
    const root = document.getElementById('guideRoot');
    const err = document.getElementById('guideError');

    try {
      const res = await fetch('./frameworks-decision-guide.md', { cache: 'no-cache' });
      if (!res.ok) throw new Error('Could not load guide file');
      const text = await res.text();
      const { marked } = await import('https://esm.sh/marked@12.0.0');
      root.innerHTML = marked.parse(text);
      root.hidden = false;
      status.hidden = true;
    } catch (e) {
      status.hidden = true;
      err.hidden = false;
      err.textContent = 'This page needs to be served over HTTP (fetch the Markdown guide). Run make serve from anatomy-site, then open this URL from localhost.';
    }
  </script>
</body>
</html>
